<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registrar Pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080C14; --surface: #0F1724; --border: rgba(255,255,255,0.08);
    --muted: #334155; --text: #E2E8F0; --dim: #64748B;
    --green: #00C9A7; --green-dark: #00796B; --green-dim: rgba(0,201,167,0.12);
    --red: #F43F5E; --red-dim: rgba(244,63,94,0.12);
    --amber: #F59E0B; --amber-dim: rgba(245,158,11,0.12);
    --purple: #8B5CF6; --blue: #3B82F6;
    --radius: 14px;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* ── FONDO ANIMADO ── */
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(40px,-60px) scale(1.1);} 66%{transform:translate(-30px,30px) scale(0.95);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(-50px,40px) scale(1.05);} 66%{transform:translate(60px,-20px) scale(1.1);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,50px) scale(0.9);} }

  .bg-glow { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:var(--bg); }
  .glow { position:absolute; border-radius:50%; filter:blur(120px); opacity:.18; }
  .glow-1 { width:60vw; height:60vw; max-width:400px; max-height:400px; background:var(--green); top:-10%; left:-10%; animation:float1 8s ease-in-out infinite; }
  .glow-2 { width:50vw; height:50vw; max-width:350px; max-height:350px; background:var(--blue); bottom:-5%; right:-10%; animation:float2 10s ease-in-out infinite; }
  .glow-3 { width:40vw; height:40vw; max-width:280px; max-height:280px; background:var(--purple); top:40%; left:40%; animation:float3 12s ease-in-out infinite; opacity:.10; }

  /* ── LAYOUT FULL WIDTH ── */
  .wrap { position:relative; z-index:1; width:100%; max-width:100%; margin:0; padding:0 0 80px; min-height:100vh; display:flex; flex-direction:column; }

  /* ── HEADER ── */
  .app-header {
    background:linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    padding:env(safe-area-inset-top, 48px) 20px 24px;
    padding-top: max(48px, env(safe-area-inset-top, 48px));
    position:sticky; top:0; z-index:10;
    width:100%;
  }
  .header-top { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .header-icon { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .header-title { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; color:#fff; }
  .header-sub { font-size:12px; color:rgba(255,255,255,0.7); margin-left:50px; }

  /* ── BODY ── */
  .body { padding:16px; display:flex; flex-direction:column; gap:12px; flex:1; width:100%; }

  /* ── LOGIN ── */
  #pantallaLogin { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:16px; padding:24px; width:100%; }
  .pin-label { font-size:14px; color:var(--dim); }
  .pin-input {
    width:200px; padding:18px; text-align:center;
    font-size:28px; font-weight:700; letter-spacing:12px;
    background:rgba(255,255,255,0.05); border:1.5px solid var(--border);
    border-radius:14px; color:#fff; outline:none;
    font-family:'Space Grotesk',sans-serif; -webkit-appearance:none;
  }
  .pin-input:focus { border-color:var(--green); }
  .btn-entrar {
    width:200px; padding:14px; background:var(--green); color:#062b25;
    border:none; border-radius:13px; font-size:15px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  .login-error {
    font-size:13px; font-weight:600; color:var(--red);
    background:var(--red-dim); border:1px solid rgba(244,63,94,.25);
    border-radius:10px; padding:10px 14px; text-align:center; display:none;
  }

  /* ── CARDS ── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; width:100%; }

  /* ── BUSCADOR ── */
  .search-wrap { position:relative; }
  .search-input {
    width:100%; padding:12px 14px 12px 40px;
    background:rgba(255,255,255,.06); border:1.5px solid var(--border);
    border-radius:11px; font-size:14px; font-family:inherit; color:#fff;
    outline:none; transition:border-color .2s, background .2s;
    -webkit-appearance:none;
  }
  .search-input:focus { border-color:var(--green); background:rgba(255,255,255,.09); }
  .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--dim); font-size:15px; pointer-events:none; }
  .sugg-box {
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:#1A2332; border:1.5px solid rgba(255,255,255,.12);
    border-radius:12px; z-index:50; max-height:220px; overflow-y:auto;
    display:none; box-shadow:0 20px 40px rgba(0,0,0,.5);
  }
  .sugg-item { padding:11px 14px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,.05); display:flex; align-items:center; gap:10px; transition:background .15s; }
  .sugg-item:last-child { border-bottom:none; }
  .sugg-item:hover { background:rgba(255,255,255,.06); }
  .sugg-av { width:36px; height:36px; border-radius:10px; flex-shrink:0; background:rgba(0,201,167,.2); color:var(--green); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .sugg-info h5 { font-size:14px; font-weight:600; color:#fff; margin-bottom:1px; }
  .sugg-info p { font-size:12px; color:var(--dim); }
  .sugg-empty { padding:16px; text-align:center; color:var(--dim); font-size:13px; }

  /* ── CHIP ESTUDIANTE ── */
  .student-chip {
    background:var(--green-dim); border:1px solid rgba(0,201,167,.3);
    border-radius:12px; padding:12px 14px;
    display:flex; align-items:center; gap:12px;
  }
  .student-av {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--green), var(--green-dark));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; color:#fff;
  }
  .student-name { font-size:14px; font-weight:600; color:#fff; }
  .student-dni { font-size:12px; color:var(--green); }
  .btn-cambiar { margin-left:auto; font-size:12px; color:var(--dim); background:none; border:none; cursor:pointer; font-family:inherit; text-decoration:underline; flex-shrink:0; }

  /* ── SECCIÓN PENDIENTES ── */
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .section-label { font-size:11px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--dim); }
  .btn-selall { font-size:12px; font-weight:600; color:var(--green); background:none; border:none; cursor:pointer; font-family:inherit; text-decoration:underline; padding:0; }

  /* ── CHECKBOXES ── */
  .pend-list { display:flex; flex-direction:column; gap:6px; }
  .pend-item {
    background:rgba(255,255,255,.04); border:1px solid var(--border);
    border-radius:11px; padding:11px 13px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
    transition:border-color .15s, background .15s; user-select:none;
  }
  .pend-item:active { transform:scale(.99); }
  .pend-item.sel { background:var(--green-dim); border-color:rgba(0,201,167,.4); }
  .pend-cb {
    width:20px; height:20px; border-radius:6px; flex-shrink:0;
    border:1.5px solid var(--muted);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .pend-item.sel .pend-cb { background:var(--green); border-color:var(--green); }
  .pend-check { display:none; color:#062b25; font-size:13px; font-weight:700; }
  .pend-item.sel .pend-check { display:block; }
  .pend-nombre { font-size:13px; color:var(--text); flex:1; line-height:1.3; }
  .pend-item.sel .pend-nombre { color:#fff; }
  .badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px; white-space:nowrap; flex-shrink:0; }
  .badge-cuota { background:rgba(59,130,246,.15); color:#93C5FD; }
  .badge-multa { background:var(--amber-dim); color:var(--amber); }
  .pend-monto { font-size:13px; font-weight:600; color:var(--dim); white-space:nowrap; }
  .pend-item.sel .pend-monto { color:var(--green); }

  .aldia { text-align:center; padding:24px; background:var(--green-dim); border:1px solid rgba(0,201,167,.3); border-radius:12px; color:var(--green); font-weight:700; font-size:14px; }

  /* ── TOTAL ── */
  .total-box {
    background:rgba(0,201,167,.08); border:1px solid rgba(0,201,167,.25);
    border-radius:12px; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .total-left .total-label { font-size:13px; color:var(--dim); }
  .total-left .total-count { font-size:11px; color:var(--muted); margin-top:2px; }
  .total-amount { font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; color:var(--green); }

  /* ── MÉTODO ── */
  .metodo-wrap { position:relative; }
  .metodo-select {
    width:100%; padding:12px 14px;
    background:rgba(255,255,255,.06); border:1.5px solid var(--border);
    border-radius:11px; font-size:14px; font-family:inherit; color:#fff;
    outline:none; -webkit-appearance:none; cursor:pointer;
    transition:border-color .2s;
  }
  .metodo-select:focus { border-color:var(--green); }
  .metodo-select option { background:#1E293B; }
  .fg label { display:block; font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--dim); margin-bottom:7px; }

  /* ── BOTÓN CONFIRMAR ── */
  .btn-confirm {
    width:100%; padding:16px; border:none; border-radius:14px;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
    background:var(--green); color:#062b25;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:opacity .2s, transform .15s;
    position:relative; overflow:hidden;
  }
  .btn-confirm:active { transform:scale(.98); }
  .btn-confirm:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .btn-confirm .sp { width:18px; height:18px; border:2.5px solid rgba(6,43,37,.3); border-radius:50%; border-top-color:#062b25; animation:spin .7s linear infinite; display:none; }
  .btn-confirm.loading .bl { display:none; }
  .btn-confirm.loading .sp { display:block; }

  /* ── BARRA DE PROGRESO ── */
  .prog-wrap { height:3px; background:rgba(255,255,255,.1); border-radius:99px; margin-top:8px; overflow:hidden; display:none; }
  .prog-wrap.vis { display:block; }
  .prog-fill { height:100%; width:0%; background:var(--green); border-radius:99px; transition:width .4s ease; }
  .prog-estado { text-align:center; font-size:11px; font-weight:600; color:var(--dim); margin-top:5px; min-height:16px; display:none; }
  .prog-estado.vis { display:block; }

  /* ── MENSAJE ── */
  .msg { display:none; padding:12px 14px; border-radius:11px; font-size:13px; font-weight:600; text-align:center; }
  .msg.ok { background:var(--green-dim); color:var(--green); border:1px solid rgba(0,201,167,.3); display:block; }
  .msg.err { background:var(--red-dim); color:var(--red); border:1px solid rgba(244,63,94,.3); display:block; }

  /* ── FOOTER ── */
  .footer { text-align:center; padding:20px; font-size:12px; color:var(--muted); }
  .btn-salir { background:none; border:none; color:var(--dim); font-size:12px; cursor:pointer; text-decoration:underline; font-family:inherit; }

  @keyframes spin { to { transform:rotate(360deg); } }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:var(--muted); border-radius:4px; }
</style>
</head>
<body>

<div class="bg-glow"><div class="glow glow-1"></div><div class="glow glow-2"></div><div class="glow glow-3"></div></div>

<div class="wrap">

  <!-- HEADER -->
  <div class="app-header">
    <div class="header-top">
      <div class="header-icon">💰</div>
      <div class="header-title">Registrar Pago</div>
    </div>
    <div class="header-sub">Tesorería del Aula</div>
  </div>

  <!-- LOGIN -->
  <div id="pantallaLogin">
    <span class="pin-label">Ingresa tu PIN de tesorero</span>
    <input type="password" id="pinInput" class="pin-input" maxlength="6" inputmode="numeric" placeholder="••••" autocomplete="off">
    <button class="btn-entrar" id="btnEntrar" onclick="verificarPin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <!-- APP -->
  <div id="pantallaApp" style="display:none;" class="body">

    <div id="msg" class="msg"></div>

    <!-- PASO 1: Buscador -->
    <div id="paso1" class="card">
      <div class="fg" style="margin:0;">
        <label>Buscar estudiante</label>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="q" class="search-input" style="padding-left:38px" placeholder="Nombre o DNI..." autocomplete="off">
          <div class="sugg-box" id="sugg"></div>
        </div>
      </div>
    </div>

    <!-- PASO 2: Pendientes -->
    <div id="paso2" style="display:none; display:none; flex-direction:column; gap:12px;">

      <!-- Chip estudiante -->
      <div class="student-chip">
        <div class="student-av" id="stuAv"></div>
        <div>
          <div class="student-name" id="stuName"></div>
          <div class="student-dni" id="stuDni"></div>
        </div>
        <button class="btn-cambiar" onclick="cambiarEst()">Cambiar</button>
      </div>

      <!-- Lista pendientes -->
      <div>
        <div class="section-header">
          <span class="section-label" id="pendLabel">Pendientes</span>
          <button class="btn-selall" id="btnSelAll">Seleccionar todo</button>
        </div>
        <div class="pend-list" id="pendList"></div>
      </div>

      <!-- Total -->
      <div class="total-box" id="totalBox">
        <div class="total-left">
          <div class="total-label">Total a registrar</div>
          <div class="total-count" id="totalCount">0 cuotas</div>
        </div>
        <div class="total-amount" id="totalAmount">S/. 0.00</div>
      </div>

      <!-- Método -->
      <div class="fg" style="margin:0;">
        <label>Método de pago</label>
        <div class="metodo-wrap">
          <select id="metodoPago" class="metodo-select">
            <option value="">Seleccione...</option>
            <option value="Efectivo">💵 Efectivo</option>
            <option value="Yape">📱 Yape</option>
            <option value="Plin">📱 Plin</option>
            <option value="Transferencia">🏦 Transferencia</option>
            <option value="Otro">📋 Otro</option>
          </select>
        </div>
      </div>

      <!-- Observaciones -->
      <div class="fg" style="margin:0;">
        <label>Observaciones (opcional)</label>
        <input type="text" id="obs" class="search-input" style="padding-left:14px" placeholder="Nº operación, código, etc." autocomplete="off">
      </div>

      <!-- Botón confirmar -->
      <button id="btnConfirmar" class="btn-confirm" disabled onclick="confirmarPagos()">
        <span class="bl" id="btnLabel">Confirmar pago</span>
        <div class="sp"></div>
      </button>
      <div class="prog-wrap" id="progWrap"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-estado" id="progEstado"></div>

    </div>

    <div class="footer">
      <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

</div>

<script>
// ── CONFIG ──
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzhFDAZmzyZLRbbJjWC3NyKEO0WYlw3S2KsO27-DLHU9AGRueEqmDHyYIJA-sZpaJ_Reg/exec';
var PIN_SECRETO = '9071';

var pinGuardado = '';
var estSeleccionado = null;
var pendientesData = [];
var todoSel = false;

// ── DEVICE ID ──
function getDeviceId() {
  var id = localStorage.getItem('deviceId');
  if (!id) { id = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36); localStorage.setItem('deviceId', id); }
  return id;
}

// ── INACTIVIDAD ──
var inactTimer;
function resetInact() {
  clearTimeout(inactTimer);
  inactTimer = setTimeout(function() { cerrarSesion(); mostrarLoginError('Sesión cerrada por inactividad.'); }, 2 * 60 * 1000);
}
function startInact() {
  ['click','keydown','input','touchstart'].forEach(function(e) { document.addEventListener(e, resetInact); });
  resetInact();
}
function stopInact() {
  clearTimeout(inactTimer);
  ['click','keydown','input','touchstart'].forEach(function(e) { document.removeEventListener(e, resetInact); });
}

// ── API ──
function api(accion, extra) {
  var body = Object.assign({ pin: pinGuardado, accion: accion, deviceId: getDeviceId() }, extra || {});
  return fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) }).then(function(r) { return r.json(); });
}

// ── LOGIN ──
function verificarPin() {
  var pin = document.getElementById('pinInput').value.trim();
  if (pin.length < 4) { mostrarLoginError('Ingresa tu PIN completo.'); return; }
  pinGuardado = pin;
  var btn = document.getElementById('btnEntrar');
  btn.disabled = true; btn.textContent = 'Verificando...';
  api('getActividades').then(function(r) {
    btn.disabled = false; btn.textContent = 'Entrar';
    if (r.ok) {
      document.getElementById('pantallaLogin').style.display = 'none';
      document.getElementById('pantallaApp').style.display = 'flex';
      startInact();
    } else {
      mostrarLoginError(r.error || 'PIN incorrecto.');
    }
  }).catch(function() { btn.disabled = false; btn.textContent = 'Entrar'; mostrarLoginError('Error de conexión.'); });
}
function mostrarLoginError(txt) { var e = document.getElementById('loginError'); e.textContent = txt; e.style.display = 'block'; }
document.getElementById('pinInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') verificarPin(); });

function cerrarSesion() {
  pinGuardado = ''; stopInact();
  document.getElementById('pantallaApp').style.display = 'none';
  document.getElementById('pantallaLogin').style.display = 'flex';
  document.getElementById('pinInput').value = '';
  document.getElementById('loginError').style.display = 'none';
  resetFormulario();
}

// ── BUSCADOR ──
var tmr;
document.getElementById('q').addEventListener('input', function() {
  clearTimeout(tmr);
  var q = this.value;
  var sb = document.getElementById('sugg');
  if (q.length === 0) { sb.style.display = 'none'; return; }
  if (q.length < 2) { sb.style.display = 'none'; return; }
  tmr = setTimeout(function() {
    api('buscarEstudiante', { query: q }).then(function(r) {
      if (!r.ok || r.data.length === 0) { sb.innerHTML = '<div class="sugg-empty">Sin resultados</div>'; sb.style.display = 'block'; return; }
      sb.innerHTML = r.data.map(function(e) {
        var ini = e.nombre.substring(0, 2).toUpperCase();
        return '<div class="sugg-item" onclick="pickEst(\'' + e.dni + '\',\'' + e.nombre.replace(/'/g, "&#39;") + '\')">' +
          '<div class="sugg-av">' + ini + '</div>' +
          '<div class="sugg-info"><h5>' + e.nombre + '</h5><p>DNI: ' + e.dni + '</p></div></div>';
      }).join('');
      sb.style.display = 'block';
    });
  }, 300);
});

document.addEventListener('click', function(e) { if (!e.target.closest('.search-wrap')) document.getElementById('sugg').style.display = 'none'; });

function pickEst(dni, nombre) {
  estSeleccionado = { dni: dni, nombre: nombre };
  document.getElementById('q').value = '✅ ' + nombre + ' (' + dni + ')';
  document.getElementById('sugg').style.display = 'none';
  document.getElementById('stuAv').textContent = nombre.substring(0, 2).toUpperCase();
  document.getElementById('stuName').textContent = nombre;
  document.getElementById('stuDni').textContent = 'DNI: ' + dni;
  document.getElementById('paso2').style.display = 'flex';
  document.getElementById('pendList').innerHTML = '<div style="padding:16px;text-align:center;color:var(--dim);font-size:13px;">Cargando...</div>';
  document.getElementById('btnConfirmar').disabled = true;
  document.getElementById('metodoPago').value = '';
  document.getElementById('obs').value = '';
  todoSel = false;
  document.getElementById('btnSelAll').textContent = 'Seleccionar todo';
  cargarPendientes(dni);
}

function cambiarEst() {
  resetFormulario();
  document.getElementById('q').value = '';
  document.getElementById('q').focus();
}

function resetFormulario() {
  estSeleccionado = null; pendientesData = []; todoSel = false;
  document.getElementById('paso2').style.display = 'none';
  document.getElementById('pendList').innerHTML = '';
  document.getElementById('totalAmount').textContent = 'S/. 0.00';
  document.getElementById('totalCount').textContent = '0 cuotas';
  document.getElementById('btnConfirmar').disabled = true;
  document.getElementById('btnLabel').textContent = 'Confirmar pago';
  document.getElementById('metodoPago').value = '';
  document.getElementById('obs').value = '';
  document.getElementById('btnSelAll').textContent = 'Seleccionar todo';
  showMsg('', '');
  ocultarProgress();
}

// ── CARGAR PENDIENTES ──
function cargarPendientes(dni) {
  api('getPendientesEstudiante', { dni: dni }).then(function(r) {
    pendientesData = r.ok ? (r.data || []) : [];
    renderPendientes();
  }).catch(function() {
    pendientesData = [];
    renderPendientes();
  });
}

function renderPendientes() {
  var list = document.getElementById('pendList');
  if (pendientesData.length === 0) {
    list.innerHTML = '<div class="aldia">🎉 Este estudiante está al día. No tiene pagos pendientes.</div>';
    document.getElementById('btnSelAll').style.display = 'none';
    document.getElementById('totalBox').style.display = 'none';
    document.getElementById('pendLabel').textContent = 'Sin pendientes';
    actualizarTotal();
    return;
  }
  document.getElementById('btnSelAll').style.display = 'block';
  document.getElementById('totalBox').style.display = 'flex';
  document.getElementById('pendLabel').textContent = 'Pendientes (' + pendientesData.length + ')';
  list.innerHTML = pendientesData.map(function(a, i) {
    var badgeCls = a.tipo === 'Asistencia' ? 'badge-multa' : 'badge-cuota';
    var badgeTxt = a.tipo === 'Asistencia' ? 'Multa' : 'Cuota';
    return '<div class="pend-item" id="item' + i + '" onclick="toggleItem(' + i + ')">' +
      '<div class="pend-cb"><span class="pend-check">✓</span></div>' +
      '<span class="pend-nombre">' + a.nombre + '</span>' +
      '<span class="badge ' + badgeCls + '">' + badgeTxt + '</span>' +
      '<span class="pend-monto">S/. ' + a.monto.toFixed(2) + '</span>' +
    '</div>';
  }).join('');
  actualizarTotal();
}

function toggleItem(i) {
  var item = document.getElementById('item' + i);
  item.classList.toggle('sel');
  actualizarTotal();
}

document.getElementById('btnSelAll').addEventListener('click', function() {
  todoSel = !todoSel;
  pendientesData.forEach(function(a, i) {
    var item = document.getElementById('item' + i);
    if (item) { if (todoSel) item.classList.add('sel'); else item.classList.remove('sel'); }
  });
  this.textContent = todoSel ? 'Deseleccionar todo' : 'Seleccionar todo';
  actualizarTotal();
});

function actualizarTotal() {
  var total = 0, count = 0;
  pendientesData.forEach(function(a, i) {
    var item = document.getElementById('item' + i);
    if (item && item.classList.contains('sel')) { total += a.monto; count++; }
  });
  document.getElementById('totalAmount').textContent = 'S/. ' + total.toFixed(2);
  document.getElementById('totalCount').textContent = count + (count === 1 ? ' cuota seleccionada' : ' cuotas seleccionadas');
  var lbl = count > 0 ? 'Confirmar ' + count + (count === 1 ? ' pago' : ' pagos') : 'Confirmar pago';
  document.getElementById('btnLabel').textContent = lbl;
  document.getElementById('btnConfirmar').disabled = count === 0;
}

// ── CONFIRMAR ──
function confirmarPagos() {
  var met = document.getElementById('metodoPago').value;
  if (!met) { showMsg('Selecciona el método de pago.', true); return; }
  var pagos = [];
  pendientesData.forEach(function(a, i) {
    var item = document.getElementById('item' + i);
    if (item && item.classList.contains('sel')) {
      pagos.push({ dni: estSeleccionado.dni, nombre: estSeleccionado.nombre, codActividad: a.codigo, nomActividad: a.nombre, monto: a.monto, metodoPago: met, obs: document.getElementById('obs').value });
    }
  });
  if (pagos.length === 0) { showMsg('Selecciona al menos una actividad.', true); return; }

  var btn = document.getElementById('btnConfirmar');
  btn.disabled = true;
  btn.classList.add('loading');
  mostrarProgress();

  api('guardarPagosBatch', { pagos: pagos }).then(function(r) {
    btn.classList.remove('loading');
    completarProgress();
    setTimeout(function() {
      ocultarProgress();
      if (!r.ok) { showMsg(r.error, true); btn.disabled = false; return; }
      var msg = '✅ ' + r.registrados + ' pago(s) registrado(s)';
      if (r.detalle) msg += ' · ' + r.detalle;
      showMsg(msg, false);
      document.getElementById('metodoPago').value = '';
      document.getElementById('obs').value = '';
      todoSel = false;
      document.getElementById('btnSelAll').textContent = 'Seleccionar todo';
      cargarPendientes(estSeleccionado.dni);
    }, 600);
  }).catch(function() {
    btn.classList.remove('loading');
    ocultarProgress();
    showMsg('Error de conexión. Intenta de nuevo.', true);
    btn.disabled = false;
  });
}

// ── BARRA DE PROGRESO ──
var progTimer;
function mostrarProgress() {
  var wrap = document.getElementById('progWrap');
  var fill = document.getElementById('progFill');
  var est  = document.getElementById('progEstado');
  wrap.classList.add('vis');
  est.classList.add('vis');
  fill.style.width = '0%';
  est.textContent = 'Verificando datos...';
  var etapas = [
    { ms: 200,  pct: '25%', txt: 'Verificando datos...' },
    { ms: 600,  pct: '50%', txt: 'Guardando pagos...' },
    { ms: 1200, pct: '75%', txt: 'Confirmando registro...' },
    { ms: 1800, pct: '88%', txt: 'Casi listo...' }
  ];
  etapas.forEach(function(e) {
    setTimeout(function() {
      if (document.getElementById('btnConfirmar').classList.contains('loading')) {
        fill.style.width = e.pct;
        est.textContent = e.txt;
      }
    }, e.ms);
  });
}
function completarProgress() {
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progEstado').textContent = '✅ Completado';
}
function ocultarProgress() {
  setTimeout(function() {
    document.getElementById('progWrap').classList.remove('vis');
    document.getElementById('progEstado').classList.remove('vis');
    document.getElementById('progFill').style.width = '0%';
  }, 400);
}

// ── MENSAJE ──
function showMsg(txt, err) {
  var m = document.getElementById('msg');
  if (!txt) { m.style.display = 'none'; return; }
  m.className = 'msg ' + (err ? 'err' : 'ok');
  m.textContent = txt;
  if (!err) setTimeout(function() { m.style.display = 'none'; }, 4500);
}
