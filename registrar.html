<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registrar Pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080C14; --surface: #0F1724; --border: rgba(255,255,255,0.08);
    --muted: #334155; --text: #E2E8F0; --dim: #64748B;
    --green: #00C9A7; --green-dim: rgba(0,201,167,0.12);
    --red: #F43F5E; --red-dim: rgba(244,63,94,0.12);
    --purple: #8B5CF6; --blue: #3B82F6;
    --radius: 16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .glow{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;}
  .glow-1{width:500px;height:500px;background:var(--purple);top:-150px;left:-100px;}
  .glow-2{width:400px;height:400px;background:var(--green);bottom:-100px;right:-80px;}
  .wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:32px 20px 60px;}

  /* ── LOGIN ── */
  #pantallaLogin{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;}
  .login-icon{font-size:48px;margin-bottom:16px;}
  .login-titulo{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#fff;margin-bottom:8px;text-align:center;}
  .login-sub{font-size:14px;color:var(--dim);margin-bottom:32px;text-align:center;}
  .pin-input{
    width:100%;max-width:280px;padding:18px;text-align:center;
    font-size:28px;font-weight:700;letter-spacing:12px;
    background:rgba(255,255,255,0.05);border:1.5px solid var(--border);
    border-radius:14px;color:#fff;outline:none;font-family:'Space Grotesk',sans-serif;
    -webkit-appearance:none;
  }
  .pin-input:focus{border-color:var(--purple);background:rgba(255,255,255,0.08);}
  .btn-entrar{
    width:100%;max-width:280px;margin-top:16px;padding:15px;
    background:var(--purple);color:#fff;border:none;border-radius:13px;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .btn-entrar:active{transform:scale(.97);}
  .login-error{
    margin-top:14px;padding:10px 16px;background:var(--red-dim);
    border:1px solid rgba(244,63,94,.25);border-radius:10px;
    font-size:13px;font-weight:600;color:var(--red);display:none;text-align:center;
  }

  /* ── APP (después de login) ── */
  #pantallaApp{display:none;}
  .hero{text-align:center;padding:24px 0 32px;}
  .hero-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(0,201,167,.15);border:1px solid rgba(0,201,167,.3);
    border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;
    color:var(--green);margin-bottom:16px;
  }
  .hero h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#fff;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;}

  .fg{margin-bottom:16px;}
  .fg label{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
  .fg input,.fg select{
    width:100%;padding:13px 15px;background:rgba(255,255,255,.07);
    border:1.5px solid var(--border);border-radius:12px;font-size:15px;
    font-family:inherit;color:#fff;outline:none;-webkit-appearance:none;
  }
  .fg input:focus,.fg select:focus{border-color:var(--green);background:rgba(255,255,255,.1);}
  .fg input[readonly]{color:var(--dim);}
  .fg select option{background:#1E293B;color:#fff;}

  .monto-wrap{position:relative;}
  .monto-pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--green);font-size:14px;pointer-events:none;}
  .monto-inp{padding-left:46px !important;}

  .sw{position:relative;}
  .sb{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:#1A2332;
    border:1.5px solid rgba(255,255,255,.15);border-radius:14px;z-index:100;
    max-height:220px;overflow-y:auto;display:none;box-shadow:0 20px 40px rgba(0,0,0,.5);
  }
  .si{padding:12px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px;}
  .si:last-child{border-bottom:none;}
  .si:hover,.si:active{background:rgba(255,255,255,.06);}
  .sa{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:rgba(139,92,246,.2);color:#A78BFA;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
  .si h5{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px;}
  .si p{font-size:12px;color:var(--dim);}
  .se{padding:16px;text-align:center;color:var(--dim);font-size:13px;}

  .btn{
    width:100%;padding:15px;background:var(--green);color:#062b25;border:none;
    border-radius:13px;font-size:15px;font-weight:800;font-family:inherit;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .sp{width:18px;height:18px;border:2.5px solid rgba(6,43,37,.3);border-radius:50%;border-top-color:#062b25;animation:spin .7s linear infinite;display:none;}
  .btn.loading .bl{display:none;}
  .btn.loading .sp{display:block;}

  .msg{display:none;padding:13px 16px;border-radius:11px;margin-bottom:18px;font-size:13px;font-weight:700;text-align:center;}
  .msg.ok{background:var(--green-dim);color:var(--green);border:1.5px solid rgba(0,201,167,.3);display:block;}
  .msg.err{background:var(--red-dim);color:var(--red);border:1.5px solid rgba(244,63,94,.3);display:block;}

  .footer{text-align:center;margin-top:32px;font-size:12px;color:var(--muted);}
  .btn-salir{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:24px;display:block;text-align:center;width:100%;font-family:inherit;}

  @keyframes spin{to{transform:rotate(360deg)}}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:var(--muted);border-radius:4px}
</style>
</head>
<body>

<div class="bg-glow"><div class="glow glow-1"></div><div class="glow glow-2"></div></div>

<div class="wrap">

  <!-- ═══ PANTALLA LOGIN ═══ -->
  <div id="pantallaLogin">
    <div class="login-icon">🔒</div>
    <div class="login-titulo">Acceso Tesorero</div>
    <div class="login-sub">Ingresa tu PIN para registrar pagos</div>
    <input type="password" id="pinInput" class="pin-input" maxlength="6" inputmode="numeric" placeholder="••••" autocomplete="off">
    <button class="btn-entrar" id="btnEntrar" onclick="verificarPin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <!-- ═══ PANTALLA APP ═══ -->
  <div id="pantallaApp">
    <div class="hero">
      <div class="hero-badge">🔓 Sesión de Tesorero</div>
      <h1>Registrar Pago</h1>
    </div>

    <div class="card">
      <div id="msg" class="msg"></div>
      <form id="form">
        <div class="fg">
          <label>Buscar Estudiante</label>
          <div class="sw">
            <input type="text" id="q" placeholder="🔍 Escribe nombre o DNI..." autocomplete="off">
            <input type="hidden" id="estVal">
            <div id="sugg" class="sb"></div>
          </div>
        </div>

        <div class="fg">
          <label>Actividad</label>
          <div class="sw">
            <input type="text" id="actQ" placeholder="🔍 Toca para ver actividades..." autocomplete="off" readonly onfocus="mostrarActs()">
            <input type="hidden" id="actVal">
            <div id="suggAct" class="sb"></div>
          </div>
        </div>

        <div class="fg">
          <label>Monto (S/.)</label>
          <div class="monto-wrap">
            <span class="monto-pre">S/.</span>
            <input type="number" id="monto" class="monto-inp" step="0.10" readonly placeholder="—">
          </div>
        </div>

        <div class="fg">
          <label>Método de Pago</label>
          <select id="metodoPago" required>
            <option value="">Seleccione...</option>
            <option value="Efectivo">💵 Efectivo</option>
            <option value="Yape">📱 Yape</option>
            <option value="Plin">📱 Plin</option>
            <option value="Transferencia">🏦 Transferencia Bancaria</option>
            <option value="Otro">📋 Otro</option>
          </select>
        </div>

        <div class="fg">
          <label>Observaciones (opcional)</label>
          <input type="text" id="obs" placeholder="Nº operación, código Yape, etc." autocomplete="off">
        </div>

        <button type="submit" id="btnS" class="btn">
          <span class="bl">Confirmar Pago</span>
          <div class="sp"></div>
        </button>
      </form>
    </div>

    <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <div class="footer">Sistema de Pagos · Tesorería</div>
</div>

<script>
  // ════════════════════════════════════════════════════════════
  // CONFIGURACIÓN
  // ════════════════════════════════════════════════════════════
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzPSXCRHiMvXmDPexEyOaWlKpz-AshWHqaZ7WP6DsA2XEMvPf72rA9RIRTkk-TMcX0OpA/exec';

  var pinGuardado = '';

  // ════════════════════════════════════════════════════════════
  // LOGIN
  // ════════════════════════════════════════════════════════════
  function verificarPin() {
    var pin = document.getElementById('pinInput').value.trim();
    if (pin.length < 4) {
      mostrarLoginError('Ingresa tu PIN completo.');
      return;
    }
    pinGuardado = pin;

    var btn = document.getElementById('btnEntrar');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    llamarApi('getActividades', {}).then(function(r) {
      btn.disabled = false;
      btn.textContent = 'Entrar';
      if (r.ok) {
        sessionStorage.setItem('pinTesoreria', pin);
        document.getElementById('pantallaLogin').style.display = 'none';
        document.getElementById('pantallaApp').style.display = 'block';
        cachearActividades(r.data);
      } else {
        mostrarLoginError(r.error || 'PIN incorrecto.');
      }
    }).catch(function() {
      btn.disabled = false;
      btn.textContent = 'Entrar';
      mostrarLoginError('Error de conexión. Intenta de nuevo.');
    });
  }

  function mostrarLoginError(txt) {
    var e = document.getElementById('loginError');
    e.textContent = txt;
    e.style.display = 'block';
  }

  document.getElementById('pinInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') verificarPin();
  });

  function cerrarSesion() {
    sessionStorage.removeItem('pinTesoreria');
    pinGuardado = '';
    document.getElementById('pantallaApp').style.display = 'none';
    document.getElementById('pantallaLogin').style.display = 'flex';
    document.getElementById('pinInput').value = '';
    document.getElementById('loginError').style.display = 'none';
  }

  // Auto-login si ya había sesión en este navegador
  window.addEventListener('load', function() {
    var saved = sessionStorage.getItem('pinTesoreria');
    if (saved) {
      document.getElementById('pinInput').value = saved;
      verificarPin();
    }
  });

  // ════════════════════════════════════════════════════════════
  // LLAMADAS A LA API (Apps Script doPost)
  // ════════════════════════════════════════════════════════════
  function llamarApi(accion, datosExtra) {
    var body = Object.assign({ pin: pinGuardado, accion: accion }, datosExtra || {});
    return fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // evita preflight CORS
      body: JSON.stringify(body)
    }).then(function(r) { return r.json(); });
  }

  // ════════════════════════════════════════════════════════════
  // FORMULARIO DE PAGO
  // ════════════════════════════════════════════════════════════
  var acts = [];

  function cachearActividades(data) {
    acts = data;
    document.getElementById('actQ').removeAttribute('readonly');
  }

  function mostrarActs() {
    if (acts.length === 0) return;
    renderActs(acts);
  }

  document.getElementById('actQ').addEventListener('input', function() {
    var q = this.value.toLowerCase();
    document.getElementById('actVal').value = '';
    document.getElementById('monto').value = '';
    if (q === '') { renderActs(acts); return; }
    var f = acts.filter(function(a) {
      return a.nombre.toLowerCase().indexOf(q) !== -1 || a.codigo.toLowerCase().indexOf(q) !== -1;
    });
    renderActs(f);
  });

  function renderActs(lista) {
    var sb = document.getElementById('suggAct');
    if (lista.length === 0) { sb.innerHTML = '<div class="se">Sin resultados</div>'; sb.style.display = 'block'; return; }
    var h = '';
    lista.forEach(function(a) {
      h += '<div class="si" onclick="pickAct(\'' + a.codigo + '\',\'' + a.nombre.replace(/'/g,"&#39;") + '\',' + a.monto + ')">' +
           '<div class="sa">🎯</div><div><h5>' + a.nombre + '</h5><p>S/. ' + a.monto.toFixed(2) + ' · Cód: ' + a.codigo + '</p></div></div>';
    });
    sb.innerHTML = h;
    sb.style.display = 'block';
  }

  function pickAct(cod, nom, mto) {
    document.getElementById('actVal').value = cod;
    document.getElementById('actQ').value = '✅ ' + nom;
    document.getElementById('monto').value = mto.toFixed(2);
    document.getElementById('suggAct').style.display = 'none';
  }

  var tmr;
  document.getElementById('q').addEventListener('input', function() {
    clearTimeout(tmr);
    var q = this.value;
    var sb = document.getElementById('sugg');
    document.getElementById('estVal').value = '';
    if (q.length < 2) { sb.style.display = 'none'; return; }
    tmr = setTimeout(function() {
      llamarApi('buscarEstudiante', { query: q }).then(function(r) {
        if (!r.ok) return;
        var d = r.data;
        if (d.length === 0) { sb.innerHTML = '<div class="se">Sin resultados</div>'; sb.style.display = 'block'; return; }
        var h = '';
        d.forEach(function(e) {
          var ini = e.nombre.substring(0, 2).toUpperCase();
          h += '<div class="si" onclick="pickEst(\'' + e.dni + '\',\'' + e.nombre.replace(/'/g,"&#39;") + '\')">' +
               '<div class="sa">' + ini + '</div><div><h5>' + e.nombre + '</h5><p>DNI: ' + e.dni + '</p></div></div>';
        });
        sb.innerHTML = h;
        sb.style.display = 'block';
      });
    }, 300);
  });

  function pickEst(dni, nom) {
    document.getElementById('estVal').value = dni + '|' + nom;
    document.getElementById('q').value = '✅ ' + nom + ' (' + dni + ')';
    document.getElementById('sugg').style.display = 'none';
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.sw')) {
      document.getElementById('sugg').style.display = 'none';
      document.getElementById('suggAct').style.display = 'none';
    }
  });

  document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();
    var ev = document.getElementById('estVal').value;
    if (!ev) { showMsg('Selecciona un estudiante de la lista.', true); return; }
    var cod = document.getElementById('actVal').value;
    if (!cod) { showMsg('Selecciona una actividad de la lista.', true); return; }
    var met = document.getElementById('metodoPago').value;
    if (!met) { showMsg('Selecciona el método de pago.', true); return; }

    setLoad(true);
    var arr = ev.split('|');
    var actNom = acts.find(function(x) { return x.codigo === cod; }).nombre;

    var datos = {
      dni: arr[0],
      nombre: arr[1],
      codActividad: cod,
      nomActividad: actNom,
      monto: document.getElementById('monto').value,
      metodoPago: met,
      obs: document.getElementById('obs').value
    };

    llamarApi('guardarPago', { datos: datos }).then(function(r) {
      setLoad(false);
      if (!r.ok) { showMsg(r.error, true); return; }
      showMsg('✅ Pago registrado (ID: ' + r.id + ')', false);
      document.getElementById('form').reset();
      document.getElementById('estVal').value = '';
      document.getElementById('actVal').value = '';
    }).catch(function() {
      setLoad(false);
      showMsg('Error de conexión. Intenta de nuevo.', true);
    });
  });

  function setLoad(on) {
    var b = document.getElementById('btnS');
    b.disabled = on;
    b.classList.toggle('loading', on);
  }
  function showMsg(txt, err) {
    var m = document.getElementById('msg');
    m.className = 'msg ' + (err ? 'err' : 'ok');
    m.textContent = txt;
    if (!err) setTimeout(function() { m.style.display = 'none'; }, 4000);
  }
</script>
</body>
</html>
