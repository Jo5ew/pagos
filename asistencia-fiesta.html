<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Asistencia</title>
<style>
  :root {
    --fondo: url('fondo.jpg');
    --acento: #c9632b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: var(--fondo);
    background-size: cover;
    background-position: center;
  }
  .card {
    background: rgba(255,255,255,0.95);
    max-width: 400px;
    width: 100%;
    padding: 28px 24px;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  h2 { margin: 0 0 16px; font-size: 20px; }
  label { font-size: 13px; font-weight: 600; color: #555; }
  input, select, button {
    width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 14px;
    font-size: 16px; box-sizing: border-box;
    border-radius: 10px; border: 1px solid #ddd;
  }
  button {
    background: var(--acento); color: white; border: none;
    font-weight: bold; cursor: pointer; margin-bottom: 0;
  }
  #estadoUbicacion { font-size: 12px; color: #888; margin-top: -8px; margin-bottom: 10px; }
  #mensaje { margin-top: 16px; font-weight: bold; text-align: center; }
  #gate, #form, #exito, #errorCodigo { display: none; }
  #exito img {
    width: 100%; max-width: 220px; display: block; margin: 0 auto 12px;
  }
  #exito { text-align: center; }

  #errorCodigo {
    position: fixed; inset: 0; background: #fff; z-index: 50;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #errorCodigo img { width: 220px; max-width: 70%; margin-bottom: 20px; }
  #errorCodigo h2 { color: #c9632b; }
  #errorCodigo button { max-width: 240px; }
</style>
</head>
<body>
<div class="card">

  <div id="gate">
    <h2>Código de acceso</h2>
    <input type="text" id="codigoInput" placeholder="Ingresa el código"
           autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
    <button onclick="verificarCodigo()">Entrar</button>
  </div>

  <div id="form">
    <h2>Registro de asistencia</h2>
    <label>Tu nombre</label>
    <select id="nombre">
      <option value="">Selecciona…</option>
      <option>ANAMURO AÑAMURO, Frank Yuber</option>
      <option>BENIQUE SUPO, Percy</option>
      <option>CACMA MAMANI, Vladimir Ronaldo</option>
      <option>CARRIZALES CAPIA, Flavio Cesar</option>
      <option>CAZASOLA CUNO, Zhaida Yoshy</option>
      <option>CHAIÑA ROQUE, Jhon Edwar</option>
      <option>CHECCA CHURA, Willian Frank</option>
      <option>CHOQUE LARICO, Andre Jhonatan</option>
      <option>CONDORI CONDORI, Elmer Salomon</option>
      <option>CONDORI VARGAS, Jhon Cristian</option>
      <option>FLORES VIVEROS, Kevin Uriel</option>
      <option>HUARACHA URIBE, Nilva Jhamileth</option>
      <option>ITO MARAZA, Cristian</option>
      <option>JANCCO CONDORI, Elvis Yampier</option>
      <option>LEON LIMA, Luis Enrique</option>
      <option>MAMANI CONDEÑA, Rudy</option>
      <option>MULLISACA TORRES, Esleyter Marco</option>
      <option>MAMANI LARICO, Andrea</option>
      <option>MAMANI MAMANI, Mirian</option>
      <option>ORTIZ JAEN, Angela Milagros</option>
      <option>PARIAPAZA OJEDA, Rosa Monica</option>
      <option>QUISPE JAEN, Jose Manuel</option>
      <option>SALAZAR MENDEZ, Maet Natali</option>
      <option>SUCASACA CCORA, Mayer Jared</option>
      <option>TORRES LAIME, Jose Luis</option>
      <option>ARNEZ CHAHUARA, Diego Alfredo</option>
    </select>

    <label>Foto (evidencia)</label>
    <input type="file" id="foto" accept="image/*" capture="environment">

    <div id="estadoUbicacion">📍 Obteniendo ubicación…</div>

    <button onclick="enviar()">Registrar</button>
    <div id="mensaje"></div>
  </div>

  <div id="exito">
    <!-- Reemplaza esta imagen por la que quieras mostrar al registrarse -->
    <img src="https://api.iconify.design/fluent-emoji/check-mark-button.svg" alt="Registrado">
    <h2 id="exitoTexto">¡Registrado!</h2>
    <button onclick="registrarOtro()">Hacer otro registro</button>
  </div>

</div>

<div id="errorCodigo">
  <img src="error.jpg" alt="Código incorrecto">
  <h2>Código incorrecto 😹</h2>
  <p>Revisa mayúsculas y espacios, e inténtalo de nuevo.</p>
  <button onclick="cerrarErrorCodigo()">Reintentar</button>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJxUqhvus342GI03SUYAKmAkW2DUeQ25vO3Id9zuDks6-t7ihE3SMXN1F8B0bM90vMHA/exec";
  const CODIGO_CORRECTO = "ANIV26";
  let coords = { lat: '', lng: '' };

  if (localStorage.getItem('codigoOk') === 'si') {
    document.getElementById('form').style.display = 'block';
  } else {
    document.getElementById('gate').style.display = 'block';
  }

  function verificarCodigo() {
    const val = document.getElementById('codigoInput').value.trim().toUpperCase();
    if (val === CODIGO_CORRECTO.toUpperCase()) {
      localStorage.setItem('codigoOk', 'si');
      document.getElementById('gate').style.display = 'none';
      document.getElementById('form').style.display = 'block';
      pedirUbicacion();
    } else {
      document.getElementById('errorCodigo').style.display = 'flex';
    }
  }

  function cerrarErrorCodigo() {
    document.getElementById('errorCodigo').style.display = 'none';
    document.getElementById('codigoInput').value = '';
  }

  if (localStorage.getItem('codigoOk') === 'si') {
    pedirUbicacion();
  }

  function pedirUbicacion() {
    const estado = document.getElementById('estadoUbicacion');
    if (!navigator.geolocation) {
      estado.textContent = '⚠️ Tu navegador no soporta ubicación, continúa igual.';
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        coords.lat = pos.coords.latitude;
        coords.lng = pos.coords.longitude;
        estado.textContent = '✅ Ubicación detectada';
      },
      () => { estado.textContent = '⚠️ No se pudo obtener ubicación, puedes continuar igual.'; },
      { timeout: 8000 }
    );
  }

  function toBase64(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  async function enviar() {
    const nombre = document.getElementById('nombre').value;
    const fotoFile = document.getElementById('foto').files[0];
    if (!nombre) { alert('Selecciona tu nombre'); return; }
    if (!fotoFile) { alert('Toma una foto primero'); return; }

    document.getElementById('mensaje').textContent = 'Enviando…';
    const fotoBase64 = await toBase64(fotoFile);

    const body = new FormData();
    body.append('codigo', CODIGO_CORRECTO);
    body.append('nombre', nombre);
    body.append('foto', fotoBase64);
    body.append('lat', coords.lat);
    body.append('lng', coords.lng);

    try {
      await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: body });
      document.getElementById('form').style.display = 'none';
      document.getElementById('exitoTexto').textContent = '¡Registrado, ' + nombre.split(',')[1].trim() + '!';
      document.getElementById('exito').style.display = 'block';
    } catch (err) {
      document.getElementById('mensaje').textContent = '❌ Error, intenta de nuevo.';
    }
  }

  function registrarOtro() {
    document.getElementById('nombre').value = '';
    document.getElementById('foto').value = '';
    document.getElementById('mensaje').textContent = '';
    document.getElementById('exito').style.display = 'none';
    document.getElementById('form').style.display = 'block';
  }
</script>
</body>
</html>
