<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Gestión de Boletos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080C14; --surface: #0F1724; --border: rgba(255,255,255,0.08);
      --text: #E2E8F0; --dim: #64748B; --green: #00C9A7;
      --purple: #8B5CF6; --purple-dim: rgba(139,92,246,0.15); --red: #F43F5E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 60px; }
    .wrap { max-width: 500px; margin: 0 auto; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .field { margin-bottom: 14px; position: relative; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: var(--purple); }

    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #162032; border: 1px solid var(--border); border-radius: 10px; max-height: 180px; overflow-y: auto; z-index: 20; display: none; }
    .sug-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .sug-item:hover { background: var(--purple-dim); color: #fff; }

    button.btn-main { width: 100%; background: var(--purple); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
    button.btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Estilos de Cajas de Boletos Interactivas */
    .boletos-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .boleto-box { 
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
      color: var(--dim); padding: 8px 14px; border-radius: 8px; font-weight: 700; 
      font-size: 14px; cursor: pointer; user-select: none; transition: 0.2s;
    }
    .boleto-box.selected { 
      background: var(--purple-dim); border-color: var(--purple); color: #A78BFA; 
    }

    .cam-box { border: 2px dashed var(--border); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; margin-top: 10px; }
    .cam-box img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; display: none; margin-top: 8px; }
    .msg { text-align: center; font-size: 13px; color: var(--dim); margin-top: 10px; }
  </style>
</head>
<body>

<div class="wrap">

  <!-- 1. BUSCADOR -->
  <div class="card">
    <div class="field">
      <label>Buscar Estudiante / Boleto</label>
      <input type="text" id="numBoleto" placeholder="Escribe un nombre o N°..." oninput="filtrarSugerencias()" autocomplete="off">
      <div id="sugerenciasBox" class="suggestions"></div>
    </div>
    <button class="btn-main" onclick="buscarBoleto()">Buscar Alumno</button>
  </div>

  <!-- 2. RESULTADO CON SELECCIÓN Y REGISTRO DIRECTO -->
  <div id="resultadoBoleto"></div>

</div>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxfmx0kpj82WMvpplf_gRzZ7Yje_sr7ZyCsIGQHfIYCMkUsvD37c-sZMUn6fWxMROS8dw/exec';
  var SHEET_ID = '1rSx_jr7Kp-pymtf5wWMiyJUJnJPZ_kILcwWR06wOAjo';
  
  var dbCache = [];
  var fotoBase64Data = "";
  var alumnoEncontrado = null;
  var boletosSeleccionados = [];

  window.onload = function() { cargarBaseDatos(); };

  function cargarBaseDatos() {
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json';
    fetch(url).then(r => r.text()).then(txt => {
      var json = JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1]);
      if (json.table && json.table.rows) {
        dbCache = json.table.rows.map(r => r.c ? r.c.map(cell => cell ? (cell.v !== null ? cell.v.toString() : '') : '') : []);
      }
    });
  }

  function filtrarSugerencias() {
    var input = document.getElementById('numBoleto').value.trim().toLowerCase();
    var box = document.getElementById('sugerenciasBox');
    if (input.length < 2) { box.style.display = 'none'; return; }

    var coincidencias = [];
    dbCache.forEach(row => {
      var texto = row.join(' ').toLowerCase();
      if (texto.includes(input)) {
        var nombre = row[2] || row[1] || row[0];
        if (nombre && !coincidencias.includes(nombre)) coincidencias.push(nombre);
      }
    });

    if (coincidencias.length === 0) { box.style.display = 'none'; return; }
    box.innerHTML = coincidencias.slice(0, 5).map(item => `<div class="sug-item" onclick="seleccionarSugerencia('${item}')">${item}</div>`).join('');
    box.style.display = 'block';
  }

  function seleccionarSugerencia(val) {
    document.getElementById('numBoleto').value = val;
    document.getElementById('sugerenciasBox').style.display = 'none';
    buscarBoleto();
  }

  function buscarBoleto() {
    var q = document.getElementById('numBoleto').value.trim().toLowerCase();
    var resDiv = document.getElementById('resultadoBoleto');
    document.getElementById('sugerenciasBox').style.display = 'none';
    fotoBase64Data = "";
    boletosSeleccionados = [];
    if (!q) return;

    var hallados = dbCache.filter(row => row.join(' ').toLowerCase().includes(q));

    if (hallados.length === 0) {
      resDiv.innerHTML = '<p class="msg" style="color:var(--red)">No se encontraron registros de este alumno.</p>';
      return;
    }

    var item = hallados[0]; // Tomar el registro principal hallado
    alumnoEncontrado = {
      salon: item[1] || '',
      nombre: item[2] || '',
      celular: item[3] || ''
    };

    var boletos = item.filter((val, idx) => idx >= 4 && val.trim() !== '' && !val.startsWith('http'));

    resDiv.innerHTML = `
      <div class="card">
        <h3 style="color:#fff; font-size:18px; margin-bottom:4px;">${alumnoEncontrado.nombre}</h3>
        <p style="font-size:13px; color:var(--dim); margin-bottom:12px;">📍 Salón: ${alumnoEncontrado.salon} ${alumnoEncontrado.celular ? '· 📱 Cel: ' + alumnoEncontrado.celular : ''}</p>
        
        <label>Toca los boletos que vas a entregar:</label>
        <div class="boletos-grid">
          ${boletos.map(b => `<div class="boleto-box" onclick="toggleBoleto(this, '${b}')">🎟️ N° ${b}</div>`).join('')}
        </div>

        <div class="field" style="margin-top:16px;">
          <label>PIN de Responsable</label>
          <input type="password" id="pinEntrega" placeholder="Ingresa tu PIN para confirmar">
        </div>

        <div class="field">
          <label>Foto de Evidencia / Entrega</label>
          <div class="cam-box" onclick="document.getElementById('fotoInput').click()">
            <span id="camText">📷 Tomar Foto de Entrega</span>
            <img id="imgPreview" alt="Foto tomada">
          </div>
          <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none;" onchange="previewImage(event)">
        </div>

        <button class="btn-main" id="btnConfirmar" onclick="confirmarEntrega()">Registrar Entrega con Foto</button>
        <p id="msgProceso" class="msg"></p>
      </div>
    `;
  }

  function toggleBoleto(elem, boleto) {
    elem.classList.toggle('selected');
    if (elem.classList.contains('selected')) {
      boletosSeleccionados.push(boleto);
    } else {
      boletosSeleccionados = boletosSeleccionados.filter(b => b !== boleto);
    }
  }

  function previewImage(event) {
    var file = event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(e) {
      fotoBase64Data = e.target.result;
      var img = document.getElementById('imgPreview');
      img.src = fotoBase64Data;
      img.style.display = 'block';
      document.getElementById('camText').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  function confirmarEntrega() {
    var pin = document.getElementById('pinEntrega').value.trim();
    var msg = document.getElementById('msgProceso');
    var btn = document.getElementById('btnConfirmar');

    if (!pin) {
      msg.style.color = "var(--red)";
      msg.innerText = "Ingresa tu PIN de responsable.";
      return;
    }

    if (boletosSeleccionados.length === 0) {
      msg.style.color = "var(--red)";
      msg.innerText = "Selecciona al menos un boleto de la lista tocando las cajas.";
      return;
    }

    btn.disabled = true;
    msg.style.color = "var(--dim)";
    msg.innerText = "Guardando entrega...";

    var payload = {
      accion: "registrarEntrega",
      pin: pin,
      salon: alumnoEncontrado.salon,
      nombre: alumnoEncontrado.nombre,
      celular: alumnoEncontrado.celular,
      boletos: boletosSeleccionados,
      fotoBase64: fotoBase64Data
    };

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(res => {
      if (res.ok) {
        msg.style.color = "var(--green)";
        msg.innerText = "¡Entrega registrada por " + res.registradoPor + "!";
        setTimeout(() => {
          document.getElementById('resultadoBoleto').innerHTML = '';
          document.getElementById('numBoleto').value = '';
          cargarBaseDatos();
        }, 2000);
      } else {
        throw new Error(res.error);
      }
    })
    .catch(err => {
      msg.style.color = "var(--red)";
      msg.innerText = "Error: " + err.message;
      btn.disabled = false;
    });
  }
</script>
</body>
</html>
