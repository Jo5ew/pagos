<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Boletos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080C14;
      --surface: #0F1724;
      --purple: #8B5CF6;
      --text: #E2E8F0;
      --dim: #64748B;
      --green: #00C9A7;
      --red: #F43F5E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 16px;
      min-height: 100vh;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      text-align: center;
      font-size: 26px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--surface);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .input-group { display: flex; gap: 10px; margin-bottom: 16px; }
    input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--purple); }
    button {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .res-card {
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      margin-top: 14px;
    }
    .tag {
      display: inline-block;
      background: rgba(0,201,167,0.15);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .msg { text-align: center; font-size: 14px; margin-top: 16px; color: var(--dim); }
    .msg.error { color: var(--red); }
    .btn-foto {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 8px 14px;
      background: rgba(139,92,246,0.15);
      color: #A78BFA;
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="wrap">
  <h1>🎟️ Consulta de Boletos gaa</h1>

  <div class="card">
    <div class="input-group">
      <input type="text" id="numBoleto" placeholder="Escribe N° boleto, nombre o salón..." onkeydown="if(event.key==='Enter') buscarBoleto()">
      <button onclick="buscarBoleto()">Buscar</button>
    </div>
    <div id="resultadoBoleto"></div>
  </div>
</div>

<script>
  var SHEET_ID = '1ObB4TZOgCkTyN0iPhrbgZZJNqNw2A81yEoAUfs7kT-8';

  function buscarBoleto() {
    var q = document.getElementById('numBoleto').value.trim().toLowerCase();
    var resDiv = document.getElementById('resultadoBoleto');
    if (!q) {
      resDiv.innerHTML = '<p class="msg error">Ingresa un término de búsqueda.</p>';
      return;
    }

    resDiv.innerHTML = '<p class="msg">Consultando base de datos...</p>';

    // Consultar vía Google Visualization API
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json';

    fetch(url)
      .then(r => r.text())
      .then(txt => {
        var json = JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1]);
        var rows = json.table.rows;

        if (!rows || rows.length === 0) {
          resDiv.innerHTML = '<p class="msg error">No hay registros en la hoja.</p>';
          return;
        }

        var hallados = [];

        rows.forEach(r => {
          if (!r.c) return;
          var valores = r.c.map(cell => cell ? (cell.v !== null && cell.v !== undefined ? cell.v.toString() : '') : '');
          var filaTexto = valores.join(' ').toLowerCase();

          if (filaTexto.includes(q)) {
            hallados.push(valores);
          }
        });

        if (hallados.length === 0) {
          resDiv.innerHTML = '<p class="msg error">No se encontraron registros de entrega con ese dato.</p>';
          return;
        }

        var html = '';
        hallados.forEach(item => {
          // Extraer información disponible de las columnas
          var info = item.filter(val => val.trim() !== '' && !val.startsWith('http'));
          var fotoUrl = item.find(val => val.startsWith('http'));

          html += `
            <div class="res-card">
              <span class="tag">Registro Encontrado</span>
              <h3 style="margin: 10px 0 6px; color:#fff;">${info[2] || info[1] || 'Estudiante'}</h3>
              <p style="font-size:13px; color:var(--dim); margin-bottom:4px;"><b>Datos del registro:</b> ${info.join(' · ')}</p>
              ${fotoUrl ? `<a href="${fotoUrl}" target="_blank" class="btn-foto">📷 Ver Evidencia en Drive</a>` : ''}
            </div>
          `;
        });
        resDiv.innerHTML = html;
      })
      .catch(err => {
        resDiv.innerHTML = '<p class="msg error">Error de conexión. Asegúrate de que el documento de Google Sheets esté compartido como público.</p>';
      });
  }
</script>
</body>
</html>
