<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Consulta de Boletos y Entregas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg:        #080C14;
      --surface:   #0F1724;
      --border:    rgba(255,255,255,0.08);
      --muted:     #334155;
      --text:      #E2E8F0;
      --dim:       #64748B;
      --green:     #00C9A7;
      --green-dim: rgba(0,201,167,0.12);
      --red:       #F43F5E;
      --amber:     #F59E0B;
      --purple:    #8B5CF6;
      --purple-dim:rgba(139,92,246,0.15);
      --radius:    16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px 60px;
    }

    .wrap { max-width: 500px; margin: 0 auto; }

    /* ── HERO ───────────────────────────────────────────────── */
    .hero { text-align: center; margin-bottom: 24px; }
    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px; font-weight: 700; color: #fff;
      margin-bottom: 6px;
    }
    .hero p { font-size: 14px; color: var(--dim); }

    /* ── CARD PRINCIPAL ─────────────────────────────────────── */
    .card-search {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .input-group { display: flex; gap: 10px; }
    input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--purple); }
    button {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }

    /* ── TARJETA DE RESULTADO ───────────────────────────────── */
    .res-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      animation: fadeUp 0.3s ease forwards;
    }
    .res-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tag-status {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(0,201,167,0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .res-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .res-meta {
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ── CAJAS DE BOLETOS ────────────────────────────────────── */
    .boletos-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--dim);
      margin-bottom: 8px;
    }
    .boletos-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .boleto-box {
      background: var(--purple-dim);
      border: 1px solid rgba(139,92,246,0.3);
      color: #A78BFA;
      padding: 8px 14px;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── CONTENEDOR DE FOTO EN GRANDE ───────────────────────── */
    .foto-container {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 12px;
      text-align: center;
    }
    .foto-img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      display: block;
    }
    .btn-drive {
      display: block;
      text-align: center;
      padding: 10px;
      background: rgba(255,255,255,0.04);
      color: var(--dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border-top: 1px solid var(--border);
      transition: background 0.2s, color 0.2s;
    }
    .btn-drive:hover { background: rgba(255,255,255,0.08); color: #fff; }

    /* ── MENSAJES ───────────────────────────────────────────── */
    .msg { text-align: center; font-size: 14px; color: var(--dim); margin-top: 10px; }
    .msg.error { color: var(--red); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>🎟️ Entrega de Boletos</h1>
    <p>Consulta por alumno, salón o N° de boleto</p>
  </div>

  <div class="card-search">
    <div class="input-group">
      <input type="text" id="numBoleto" placeholder="Escribe para buscar..." onkeydown="if(event.key==='Enter') buscarBoleto()">
      <button onclick="buscarBoleto()">Buscar</button>
    </div>
  </div>

  <div id="resultadoBoleto"></div>
</div>

<script>
  var SHEET_ID = '1rSx_jr7Kp-pymtf5wWMiyJUJnJPZ_kILcwWR06wOAjo';

  // Convierte enlace de Google Drive en URL directa para mostrar imagen <img>
  function obtenerUrlImagenDirecta(url) {
    if (!url) return '';
    if (url.includes('drive.google.com')) {
      var idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (idMatch && idMatch[1]) {
        return 'https://lh3.googleusercontent.com/d/' + idMatch[1];
      }
    }
    return url;
  }

  function buscarBoleto() {
    var q = document.getElementById('numBoleto').value.trim().toLowerCase();
    var resDiv = document.getElementById('resultadoBoleto');
    if (!q) {
      resDiv.innerHTML = '<p class="msg error">Escribe un parámetro de búsqueda.</p>';
      return;
    }

    resDiv.innerHTML = '<p class="msg">Buscando en la base de datos...</p>';

    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json';

    fetch(url)
      .then(r => r.text())
      .then(txt => {
        var json = JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1]);
        var rows = json.table.rows;

        if (!rows || rows.length === 0) {
          resDiv.innerHTML = '<p class="msg error">No hay registros almacenados.</p>';
          return;
        }

        var hallados = [];

        rows.forEach(r => {
          if (!r.c) return;
          var valores = r.c.map(cell => cell ? (cell.v !== null && cell.v !== undefined ? cell.v.toString() : '') : '');
          var filaTexto = valores.join(' ').toLowerCase();

          if (filaTexto.includes(q)) {
            hallados.push(valores);
          }
        });

        if (hallados.length === 0) {
          resDiv.innerHTML = '<p class="msg error">No se encontraron entregas de boletos para "' + q + '".</p>';
          return;
        }

        var html = '';
        hallados.forEach(item => {
          // Extraer campos (Timestamp, Salón, Alumno, Teléfono, Boletos..., Foto)
          var fecha  = item[0] || 'Sin fecha';
          var salon  = item[1] || 'Sin salón';
          var alumno = item[2] || 'Estudiante';
          var cel    = item[3] || '';
          
          // Buscar la foto
          var fotoOriginal = item.find(val => val.startsWith('http')) || '';
          var fotoDirecta  = obtenerUrlImagenDirecta(fotoOriginal);

          // Extraer números de boletos (columnas del medio que sean números/códigos)
          var boletos = item.filter((val, idx) => idx >= 4 && val.trim() !== '' && !val.startsWith('http'));

          html += `
            <div class="res-card">
              <div class="res-header">
                <span class="tag-status">✓ Entregado</span>
                <span style="font-size:12px; color:var(--dim);">${fecha.substring(0,10)}</span>
              </div>

              <div class="res-title">${alumno}</div>
              <div class="res-meta">
                <span>📍 <b>Salón:</b> ${salon}</span>
                ${cel ? `<span>📱 <b>Cel:</b> ${cel}</span>` : ''}
              </div>

              ${boletos.length > 0 ? `
                <div class="boletos-label">Boletos Asignados (${boletos.length})</div>
                <div class="boletos-grid">
                  ${boletos.map(b => `<div class="boleto-box">🎟️ N° ${b}</div>`).join('')}
                </div>
              ` : ''}

              ${fotoDirecta ? `
                <div class="boletos-label">Evidencia de Entrega</div>
                <div class="foto-container">
                  <img src="${fotoDirecta}" class="foto-img" alt="Evidencia" onerror="this.onerror=null; this.src='${fotoOriginal}';">
                  <a href="${fotoOriginal}" target="_blank" class="btn-drive">🔗 Abrir en Google Drive</a>
                </div>
              ` : ''}
            </div>
          `;
        });

        resDiv.innerHTML = html;
      })
      .catch(err => {
        resDiv.innerHTML = '<p class="msg error">Error al conectar con la base de datos de Google Sheets.</p>';
      });
  }
</script>
</body>
</html>
