<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Gestión de Boletos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080C14; --surface: #0F1724; --border: rgba(255,255,255,0.08);
      --text: #E2E8F0; --dim: #64748B; --green: #00C9A7;
      --purple: #8B5CF6; --purple-dim: rgba(139,92,246,0.2); --red: #F43F5E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 60px; }
    .wrap { max-width: 600px; margin: 0 auto; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .field { margin-bottom: 14px; position: relative; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: var(--purple); }

    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #162032; border: 1px solid var(--border); border-radius: 10px; max-height: 180px; overflow-y: auto; z-index: 20; display: none; }
    .sug-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .sug-item:hover { background: var(--purple-dim); color: #fff; }

    .grid-dos-col { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 14px; }
    @media(min-width: 480px) {
      .grid-dos-col { grid-template-columns: 1.1fr 0.9fr; }
    }

    /* Tarjetas de Boletos con Edición Dinámica */
    .boletos-grid { display: flex; flex-direction: column; gap: 8px; }
    .boleto-card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .boleto-row { display: flex; justify-content: space-between; align-items: center; }
    .boleto-box { 
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
      color: var(--dim); padding: 10px 12px; border-radius: 8px; font-weight: 700; 
      font-size: 13px; cursor: pointer; user-select: none; transition: 0.2s;
      display: flex; justify-content: space-between; align-items: center;
    }
    .boleto-box.selected { 
      background: var(--purple-dim); border-color: var(--purple); color: #A78BFA; 
    }
    .btn-edit-num { background: transparent; border: none; color: var(--dim); font-size: 11px; cursor: pointer; text-decoration: underline; margin-left: 8px; }
    .btn-edit-num:hover { color: #fff; }

    /* Módulo Cámara FULL SIZE (Ocupa todo el contenedor) */
    .cam-box { 
      border: 2px dashed var(--border); border-radius: 12px; height: 100%; min-height: 180px; 
      position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; 
      justify-content: center; align-items: center; background: rgba(0,0,0,0.3); 
    }
    .cam-box img { 
      width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; border-radius: 10px; 
    }
    .cam-box span { z-index: 2; font-size: 12px; font-weight: 600; color: var(--dim); text-align: center; padding: 8px; background: rgba(8,12,20,0.7); border-radius: 6px; }

    /* Estilo de Boleta / Pre-Registro */
    .ticket-box { background: #162032; border: 1px dashed var(--purple); border-radius: 12px; padding: 16px; margin: 16px 0; display: none; }
    .ticket-header { font-size: 13px; font-weight: 700; color: #A78BFA; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 10px; }
    .ticket-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text); }

    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    button.btn-main { width: 100%; background: var(--purple); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
    button.btn-sec { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { text-align: center; font-size: 13px; color: var(--dim); margin-top: 10px; }
  </style>
</head>
<body>

<div class="wrap">

  <div class="card">
    <div class="field">
      <label>Buscar Estudiante / Boleto</label>
      <input type="text" id="numBoleto" placeholder="Escribe un nombre o N°..." oninput="filtrarSugerencias()" autocomplete="off">
      <div id="sugerenciasBox" class="suggestions"></div>
    </div>
    <button class="btn-main" onclick="buscarBoleto()">Buscar Alumno</button>
  </div>

  <div id="resultadoBoleto"></div>

</div>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxfmx0kpj82WMvpplf_gRzZ7Yje_sr7ZyCsIGQHfIYCMkUsvD37c-sZMUn6fWxMROS8dw/exec';
  var SHEET_ID = '1rSx_jr7Kp-pymtf5wWMiyJUJnJPZ_kILcwWR06wOAjo';
  
  var dbCache = [];
  var fotoPrincipalBase64 = "";
  var fotoExtraBase64 = "";
  var alumnoEncontrado = null;
  var boletosData = []; 

  window.onload = function() { cargarBaseDatos(); };

  function cargarBaseDatos() {
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json';
    fetch(url).then(r => r.text()).then(txt => {
      var json = JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/)[1]);
      if (json.table && json.table.rows) {
        dbCache = json.table.rows.map(r => r.c ? r.c.map(cell => cell ? (cell.v !== null ? cell.v.toString() : '') : '') : []);
      }
    });
  }

  function filtrarSugerencias() {
    var input = document.getElementById('numBoleto').value.trim().toLowerCase();
    var box = document.getElementById('sugerenciasBox');
    if (input.length < 2) { box.style.display = 'none'; return; }

    var coincidencias = [];
    dbCache.forEach(row => {
      var texto = row.join(' ').toLowerCase();
      if (texto.includes(input)) {
        var nombre = row[2] || row[1] || row[0];
        if (nombre && !coincidencias.includes(nombre)) coincidencias.push(nombre);
      }
    });

    if (coincidencias.length === 0) { box.style.display = 'none'; return; }
    box.innerHTML = coincidencias.slice(0, 5).map(item => `<div class="sug-item" onclick="seleccionarSugerencia('${item}')">${item}</div>`).join('');
    box.style.display = 'block';
  }

  function seleccionarSugerencia(val) {
    document.getElementById('numBoleto').value = val;
    document.getElementById('sugerenciasBox').style.display = 'none';
    buscarBoleto();
  }

  function obtenerUrlDirecta(url) {
    if (!url) return '';
    if (url.includes('drive.google.com')) {
      var m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (m && m[1]) return 'https://lh3.googleusercontent.com/d/' + m[1];
    }
    return url;
  }

  function buscarBoleto() {
    var q = document.getElementById('numBoleto').value.trim().toLowerCase();
    var resDiv = document.getElementById('resultadoBoleto');
    document.getElementById('sugerenciasBox').style.display = 'none';
    fotoPrincipalBase64 = "";
    fotoExtraBase64 = "";
    if (!q) return;

    var hallados = dbCache.filter(row => row.join(' ').toLowerCase().includes(q));

    if (hallados.length === 0) {
      resDiv.innerHTML = '<p class="msg" style="color:var(--red)">No se encontraron registros.</p>';
      return;
    }

    var item = hallados[0];
    alumnoEncontrado = {
      salon: item[1] || '',
      nombre: item[2] || '',
      celular: item[3] || ''
    };

    var fotoUrlHoja = item.find(val => val.startsWith('http')) || '';
    var fotoDirecta = obtenerUrlDirecta(fotoUrlHoja);
    
    // Mapeo dinámico de boletos (permite mutación de números si no coinciden)
    var rawBoletos = item.filter((val, idx) => idx >= 4 && val.trim() !== '' && !val.startsWith('http'));
    boletosData = rawBoletos.map((num, idx) => ({ id: idx, numero: num, seleccionado: false }));

    renderFormulario(fotoDirecta);
  }

  function renderFormulario(fotoDirecta) {
    var resDiv = document.getElementById('resultadoBoleto');

    resDiv.innerHTML = `
      <div class="card" id="formBloque">
        <h3 style="color:#fff; font-size:18px; margin-bottom:4px;">${alumnoEncontrado.nombre}</h3>
        <p style="font-size:13px; color:var(--dim); margin-bottom:8px;">📍 Salón: ${alumnoEncontrado.salon} ${alumnoEncontrado.celular ? '· 📱 Cel: ' + alumnoEncontrado.celular : ''}</p>
        
        <div class="grid-dos-col">
          <div>
            <label>Toca los boletos a entregar:</label>
            <div class="boletos-grid" id="boletosListContainer">
              ${renderBoletosHTML()}
            </div>
          </div>

          <div>
            <label>Evidencia Principal:</label>
            <div class="cam-box" onclick="document.getElementById('fotoInput').click()">
              ${fotoDirecta && !fotoPrincipalBase64 ? 
                `<img id="imgPreview" src="${fotoDirecta}"><span>📷 Cambiar Foto</span>` : 
                `<img id="imgPreview" src="${fotoPrincipalBase64}" style="${fotoPrincipalBase64 ? '' : 'display:none;'}">
                 <span id="camText">${fotoPrincipalBase64 ? '📷 Cambiar Foto' : '📷 Tomar / Subir Foto'}</span>`
              }
            </div>
            <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none;" onchange="previewImage(event, 'principal')">
          </div>
        </div>

        <!-- FOTO EXTRA ADICIONAL -->
        <div class="field" style="margin-top:16px;">
          <label>Foto Adjunta Adicional (Opcional - Vouchers / Comprobantes):</label>
          <div class="cam-box" style="min-height:90px;" onclick="document.getElementById('fotoExtraInput').click()">
            <img id="imgExtraPreview" src="${fotoExtraBase64}" style="${fotoExtraBase64 ? '' : 'display:none;'}">
            <span id="camExtraText">${fotoExtraBase64 ? '📎 Adjunto Cargado (Toca para cambiar)' : '📎 Adjuntar Segunda Foto / Voucher'}</span>
          </div>
          <input type="file" id="fotoExtraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewImage(event, 'extra')">
        </div>

        <div class="field" style="margin-top:14px;">
          <label>PIN de Responsable</label>
          <input type="password" id="pinEntrega" placeholder="Ingresa tu PIN de autorización">
        </div>

        <!-- BOLETA DE PRE-REGISTRO -->
        <div class="ticket-box" id="boletaPrevia">
          <div class="ticket-header">🧾 Resumen de Pre-Entrega</div>
          <div class="ticket-row"><span>Estudiante:</span> <b id="tNombre"></b></div>
          <div class="ticket-row"><span>Salón:</span> <b id="tSalon"></b></div>
          <div class="ticket-row"><span>Boletos:</span> <b id="tBoletos" style="color:var(--green);"></b></div>
          <div class="ticket-row"><span>Evidencia Principal:</span> <b id="tFotoMain"></b></div>
          <div class="ticket-row"><span>Evidencia Extra:</span> <b id="tFotoExtra"></b></div>
        </div>

        <div id="btnAcciones">
          <button class="btn-main" onclick="generarPreRegistro()">Generar Pre-Registro</button>
        </div>
        <p id="msgProceso" class="msg"></p>
      </div>
    `;
  }

  function renderBoletosHTML() {
    return boletosData.map(b => `
      <div class="boleto-card">
        <div class="boleto-row">
          <div class="boleto-box ${b.seleccionado ? 'selected' : ''}" onclick="toggleBoleto(${b.id})">
            <span>🎟️ N° ${b.numero}</span>
            <span style="font-size:11px;">${b.seleccionado ? '✓ Seleccionado' : 'Tocar'}</span>
          </div>
        </div>
        <div style="text-align:right;">
          <button class="btn-edit-num" onclick="editarNumeroBoleto(${b.id})">✏️ ¿El número no coincide? Corregir</button>
        </div>
      </div>
    `).join('');
  }

  function toggleBoleto(id) {
    var item = boletosData.find(b => b.id === id);
    if (item) {
      item.seleccionado = !item.seleccionado;
      document.getElementById('boletosListContainer').innerHTML = renderBoletosHTML();
    }
  }

  function editarNumeroBoleto(id) {
    var item = boletosData.find(b => b.id === id);
    if (!item) return;

    var nuevoNum = prompt("Ingresa el número real del boleto físico:", item.numero);
    if (nuevoNum !== null && nuevoNum.trim() !== "") {
      item.numero = nuevoNum.trim();
      document.getElementById('boletosListContainer').innerHTML = renderBoletosHTML();
    }
  }

  function previewImage(event, tipo) {
    var file = event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(e) {
      if (tipo === 'principal') {
        fotoPrincipalBase64 = e.target.result;
        var img = document.getElementById('imgPreview');
        img.src = fotoPrincipalBase64;
        img.style.display = 'block';
        document.getElementById('camText').innerText = "📷 Cambiar Foto";
      } else {
        fotoExtraBase64 = e.target.result;
        var imgExtra = document.getElementById('imgExtraPreview');
        imgExtra.src = fotoExtraBase64;
        imgExtra.style.display = 'block';
        document.getElementById('camExtraText').innerText = "📎 Adjunto Cargado (Toca para cambiar)";
      }
    };
    reader.readAsDataURL(file);
  }

  function generarPreRegistro() {
    var pin = document.getElementById('pinEntrega').value.trim();
    var msg = document.getElementById('msgProceso');
    var elegidos = boletosData.filter(b => b.seleccionado).map(b => b.numero);

    if (elegidos.length === 0) {
      msg.style.color = "var(--red)";
      msg.innerText = "Marca al menos un boleto para continuar.";
      return;
    }
    if (!pin) {
      msg.style.color = "var(--red)";
      msg.innerText = "Ingresa tu PIN de responsable.";
      return;
    }

    msg.innerText = "";
    document.getElementById('tNombre').innerText = alumnoEncontrado.nombre;
    document.getElementById('tSalon').innerText = alumnoEncontrado.salon;
    document.getElementById('tBoletos').innerText = "N° " + elegidos.join(', N° ');
    document.getElementById('tFotoMain').innerText = fotoPrincipalBase64 ? "Sí (Adjuntada)" : "Existente en Servidor / Sin foto";
    document.getElementById('tFotoExtra').innerText = fotoExtraBase64 ? "Sí (Adjuntada)" : "No adjuntada";

    document.getElementById('boletaPrevia').style.display = "block";

    document.getElementById('btnAcciones').innerHTML = `
      <div class="btn-group">
        <button class="btn-sec" onclick="corregirDatos()">✏️ Corregir Datos</button>
        <button class="btn-main" onclick="confirmarEntregaFinal()">Confirmar y Registrar</button>
      </div>
    `;
  }

  function corregirDatos() {
    document.getElementById('boletaPrevia').style.display = "none";
    document.getElementById('btnAcciones').innerHTML = `
      <button class="btn-main" onclick="generarPreRegistro()">Generar Pre-Registro</button>
    `;
    document.getElementById('msgProceso').innerText = "";
  }

  function confirmarEntregaFinal() {
    var pin = document.getElementById('pinEntrega').value.trim();
    var msg = document.getElementById('msgProceso');
    var elegidos = boletosData.filter(b => b.seleccionado).map(b => b.numero);

    msg.style.color = "var(--dim)";
    msg.innerText = "Guardando datos y archivos de evidencia...";

    var payload = {
      accion: "registrarEntrega",
      pin: pin,
      salon: alumnoEncontrado.salon,
      nombre: alumnoEncontrado.nombre,
      celular: alumnoEncontrado.celular,
      boletos: elegidos,
      fotoBase64: fotoPrincipalBase64,
      fotoExtraBase64: fotoExtraBase64
    };

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(res => {
      if (res.ok) {
        msg.style.color = "var(--green)";
        msg.innerText = "¡Entrega registrada exitosamente por " + res.registradoPor + "!";
        setTimeout(() => {
          document.getElementById('resultadoBoleto').innerHTML = '';
          document.getElementById('numBoleto').value = '';
          cargarBaseDatos();
        }, 2000);
      } else {
        throw new Error(res.error);
      }
    })
    .catch(err => {
      msg.style.color = "var(--red)";
      msg.innerText = "Error: " + err.message;
    });
  }
</script>
</body>
</html>
